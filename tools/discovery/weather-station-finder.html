<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Weather Station Finder</title>
  <style>
    :root {
      --bg-top: #dce9ff;
      --bg-bottom: #f8f4e8;
      --ink: #102030;
      --ink-soft: #33556f;
      --panel: rgba(255, 255, 255, 0.86);
      --line: rgba(16, 32, 48, 0.14);
      --accent: #0b7d61;
      --accent-2: #0a5f9b;
      --danger: #a92d2d;
      --shadow: 0 14px 36px rgba(6, 22, 39, 0.17);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1100px 650px at -10% -20%, rgba(57, 123, 202, 0.16), transparent 60%),
        radial-gradient(900px 480px at 105% 0%, rgba(12, 125, 97, 0.16), transparent 58%),
        linear-gradient(165deg, var(--bg-top), var(--bg-bottom));
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .panel {
      width: min(760px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(4px);
      overflow: hidden;
      animation: reveal 380ms ease-out;
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    header {
      background: linear-gradient(120deg, #0a5f9b, #0b7d61);
      color: #fff;
      padding: 18px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: 0.02em;
    }

    header p {
      margin: 8px 0 0;
      opacity: 0.94;
      font-size: 0.95rem;
    }

    .content {
      padding: 18px 20px 22px;
      display: grid;
      gap: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    input, button {
      border-radius: 10px;
      border: 1px solid var(--line);
      font: inherit;
      padding: 10px 12px;
    }

    input {
      background: #fff;
      color: var(--ink);
      width: 100%;
    }

    button {
      background: linear-gradient(120deg, var(--accent-2), var(--accent));
      color: #fff;
      border: none;
      cursor: pointer;
      min-width: 132px;
      transition: transform 120ms ease, filter 120ms ease;
    }

    button:hover { transform: translateY(-1px); filter: brightness(1.04); }
    button:disabled { opacity: 0.7; cursor: progress; transform: none; }

    .status {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.7);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--ink-soft);
      min-height: 54px;
    }

    .status.error {
      color: var(--danger);
      border-color: rgba(169, 45, 45, 0.26);
      background: rgba(169, 45, 45, 0.08);
    }

    .status.ok {
      color: #0d5f37;
      border-color: rgba(13, 95, 55, 0.3);
      background: rgba(13, 95, 55, 0.09);
    }

    .mono {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.95rem;
    }

    .meta {
      display: grid;
      gap: 6px;
      font-size: 0.92rem;
      color: var(--ink-soft);
    }

    a {
      color: #0b4f84;
      font-weight: 600;
      word-break: break-all;
    }

    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="panel">
    <header>
      <h1>Weather Station Finder</h1>
      <p>Scans your local subnet for a Pico exposing /identify on port 80.</p>
    </header>

    <section class="content">
      <div class="meta">
        <div>Expected marker header: <span class="mono">X-Weather-Station: pico-weather-station</span></div>
        <div>If auto-detection fails, enter a subnet like <span class="mono">192.168.1.0/24</span>.</div>
      </div>

      <div class="grid">
        <input id="subnetInput" placeholder="Auto-detect /24 subnet (or enter manually)">
        <button id="scanButton" type="button">Scan Network</button>
      </div>

      <div id="status" class="status">Ready.</div>
      <div id="result"></div>
    </section>
  </main>

  <script>
    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");
    const subnetInput = document.getElementById("subnetInput");
    const scanButton = document.getElementById("scanButton");

    const REQUEST_TIMEOUT_MS = 900;
    const CONCURRENCY = 40;
    const DEVICE_HEADER = "pico-weather-station";

    function setStatus(message, kind) {
      statusEl.textContent = message;
      statusEl.className = "status" + (kind ? " " + kind : "");
    }

    function parseSubnetPrefix(raw) {
      const trimmed = raw.trim();
      if (!trimmed) return null;

      const slashIdx = trimmed.indexOf("/");
      if (slashIdx < 0) {
        return null;
      }

      const ipPart = trimmed.slice(0, slashIdx).trim();
      const maskPart = trimmed.slice(slashIdx + 1).trim();
      const octets = ipPart.split(".").map(Number);
      if (octets.length !== 4 || octets.some((n) => !Number.isInteger(n) || n < 0 || n > 255)) {
        return null;
      }
      if (maskPart !== "24") {
        return null;
      }

      return `${octets[0]}.${octets[1]}.${octets[2]}`;
    }

    async function detectLocalIpv4ViaWebRtc() {
      const RTCPeerConnectionCtor = window.RTCPeerConnection || window.webkitRTCPeerConnection;
      if (!RTCPeerConnectionCtor) {
        return null;
      }

      return new Promise((resolve) => {
        let settled = false;
        const done = (value) => {
          if (settled) return;
          settled = true;
          try {
            connection.close();
          } catch (_) {}
          resolve(value);
        };

        const connection = new RTCPeerConnectionCtor({ iceServers: [] });
        connection.createDataChannel("probe");

        connection.onicecandidate = (event) => {
          if (!event.candidate || !event.candidate.candidate) {
            return;
          }
          const candidate = event.candidate.candidate;
          const match = candidate.match(/(\d+\.\d+\.\d+\.\d+)/);
          if (!match) {
            return;
          }
          const ip = match[1];
          if (ip.startsWith("127.")) {
            return;
          }
          done(ip);
        };

        connection.createOffer()
          .then((offer) => connection.setLocalDescription(offer))
          .catch(() => done(null));

        setTimeout(() => done(null), 2200);
      });
    }

    function ipToPrefix(ip) {
      const octets = ip.split(".");
      if (octets.length !== 4) {
        return null;
      }
      return `${octets[0]}.${octets[1]}.${octets[2]}`;
    }

    async function probeHost(ip) {
      const endpoint = `http://${ip}/identify`;
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);

      try {
        const response = await fetch(endpoint, {
          method: "GET",
          mode: "cors",
          cache: "no-store",
          signal: controller.signal
        });

        const marker = (response.headers.get("x-weather-station") || "").toLowerCase();
        if (marker !== DEVICE_HEADER) {
          return null;
        }

        return {
          ip,
          endpoint,
          mode: response.headers.get("x-weather-station-mode") || "unknown"
        };
      } catch (_) {
        return null;
      } finally {
        clearTimeout(timeout);
      }
    }

    async function findWeatherStation(prefix) {
      const hosts = [];
      for (let i = 1; i <= 254; i += 1) {
        hosts.push(`${prefix}.${i}`);
      }

      let cursor = 0;
      let found = null;

      async function worker() {
        while (cursor < hosts.length && !found) {
          const current = hosts[cursor];
          cursor += 1;
          const hit = await probeHost(current);
          if (hit && !found) {
            found = hit;
            return;
          }
        }
      }

      const workers = [];
      for (let i = 0; i < CONCURRENCY; i += 1) {
        workers.push(worker());
      }

      await Promise.all(workers);
      return found;
    }

    async function autoFillSubnet() {
      const localIp = await detectLocalIpv4ViaWebRtc();
      if (!localIp) {
        return;
      }
      const prefix = ipToPrefix(localIp);
      if (!prefix) {
        return;
      }
      subnetInput.value = `${prefix}.0/24`;
      setStatus(`Auto-detected local network: ${prefix}.0/24`, "ok");
    }

    scanButton.addEventListener("click", async () => {
      resultEl.textContent = "";

      let prefix = parseSubnetPrefix(subnetInput.value);
      if (!prefix) {
        setStatus("Trying to auto-detect subnet via WebRTC...", "");
        const localIp = await detectLocalIpv4ViaWebRtc();
        if (localIp) {
          prefix = ipToPrefix(localIp);
          subnetInput.value = `${prefix}.0/24`;
        }
      }

      if (!prefix) {
        setStatus("Could not infer subnet. Enter one manually, for example 192.168.1.0/24.", "error");
        return;
      }

      scanButton.disabled = true;
      setStatus(`Scanning ${prefix}.0/24 on port 80...`, "");

      const started = Date.now();
      const found = await findWeatherStation(prefix);
      const elapsedMs = Date.now() - started;

      scanButton.disabled = false;

      if (!found) {
        setStatus(`No Weather Station found in ${prefix}.0/24 after ${(elapsedMs / 1000).toFixed(1)}s.`, "error");
        resultEl.innerHTML = "";
        return;
      }

      setStatus(`Found Weather Station at ${found.ip} (${found.mode} mode).`, "ok");
      resultEl.innerHTML = `<p><a href="http://${found.ip}/" target="_blank" rel="noopener">Open Weather Station Status Page</a></p>`;
      window.location.href = `http://${found.ip}/`;
    });

    autoFillSubnet();
  </script>
</body>
</html>
